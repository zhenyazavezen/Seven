        :root {

            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
            user-select: none;
        }

        h1 {
            font-size: 22px;
            margin-bottom: 4px;
        }

        .subtitle {
            font-size: 14px;
            color: var(--hint-color);
            margin-bottom: 16px;
        }

        .buy-banner {
            background-color: var(--button-color);
            color: var(--button-text);
            border: none;
            border-radius: 14px;
            padding: 16px;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            margin-bottom: 20px;
            box-shadow: 0 4px 12px rgba(46, 166, 255, 0.3);
            transition: transform 0.1s ease;
        }

        .buy-banner:active {
            transform: scale(0.98);
        }

        .section-title {
            font-size: 12px;
            text-transform: uppercase;
            color: var(--hint-color);
            margin: 20px 0 10px 0;
            letter-spacing: 0.5px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .card:active {
            transform: scale(0.98);
        }

        .card-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .card-icon {
            font-size: 24px;
        }

        .card-title {
            font-size: 16px;
            font-weight: 500;
        }

        .lock-icon {
            font-size: 18px;
            opacity: 0.8;
        }

        .workout-card {
            background-color: var(--card-bg);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .workout-card:active {
            transform: scale(0.98);
        }

        .workout-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .workout-name {
            font-size: 17px;
            font-weight: 600;
        }

        .workout-meta {
            font-size: 13px;
            color: var(--button-color);
            font-weight: 500;
            margin-bottom: 8px;
        }

        .workout-desc {
            font-size: 14px;
            color: var(--hint-color);
            line-height: 1.4;
        }

        .back-btn {
            background: transparent;
            color: var(--button-color);
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            padding: 0;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .hidden {
            display: none !important;

            targetList = challengeWorkouts;

                        <span class="workout-name">${item.title}</span>
                        <span class="lock-icon">${isSubscribed ? '▶️' : '🔒'}</span>

                    <div class="workout-desc">${item.desc}</div>

        // Клик по конкретной тренировке
        function handleWorkoutClick(url) {
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');

            if (isSubscribed) {
                tg.openTelegramLink(url);
            } else {
                openSubscription();
            }
        }

        function openSubscription() {
            const user = tg.initDataUnsafe?.user;
            const currentUsername = user?.username ? user.username.toLowerCase() : '';

            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');

            if (currentUsername === DEV_USERNAME.toLowerCase()) {
                tg.showAlert('Режим разработчика активен. Доступ бесплатный!');
                return;
            }

            tg.openInvoice(INVOICE_LINK, (status) => {
                if (status === 'paid') {
                    if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                    
                    const thirtyDaysMs = 30 * 24 * 60 * 60 * 1000;
                    const expiresAt = new Date().getTime() + thirtyDaysMs;

                    tg.CloudStorage.setItem('subscription_expires', String(expiresAt), (err, saved) => {
                        if (saved) {
                            unlockAll('PREMIUM доступ активирован на 30 дней');
                            tg.showAlert('🎉 Оплата прошла успешно! Подписка оформлена на 1 месяц.');
                        }
                    });
                } else if (status === 'failed') {
                    if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
                    tg.showAlert('Не удалось провести платеж. Попробуйте еще раз.');
                }
            });
        }

        function unlockAll(statusText) {
            isSubscribed = true;
            document.querySelectorAll('.main-lock').forEach(icon => icon.textContent = '▶️');
            
            const buyBtn = document.getElementById('buyBtn');
            if (buyBtn) buyBtn.style.display = 'none';
            
            const subtitle = document.getElementById('subtitle');
            if (subtitle) {
                subtitle.innerHTML = 'Статус: <b style="color: #32d74b;">' + statusText + '</b>';
            }
            if (currentCategoryKey) {
                renderWorkoutsList();
            }
        }
